version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eallsource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eallsource}
      POSTGRES_DB: ${POSTGRES_DB:-eallsource}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eallsource}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (cache + BullMQ queues)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-eallsource}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js web app
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eallsource}:${POSTGRES_PASSWORD:-eallsource}@postgres:5432/${POSTGRES_DB:-eallsource}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-eallsource}@redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3000:3000"

  # BullMQ workers (separate process)
  workers:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eallsource}:${POSTGRES_PASSWORD:-eallsource}@postgres:5432/${POSTGRES_DB:-eallsource}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-eallsource}@redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [web]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
